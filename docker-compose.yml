version: '3.8'

services:
  gateway-api:
    build: .
    container_name: ai-security-gateway-api
    ports:
      - "8000:8000"
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8000
      GATEWAY_AUDIT_SALT: ${GATEWAY_AUDIT_SALT:?Set GATEWAY_AUDIT_SALT in your environment}
      GATEWAY_ADMIN_API_KEY: ${GATEWAY_ADMIN_API_KEY:?Set GATEWAY_ADMIN_API_KEY in your environment}
      GATEWAY_POLICY_PATH: policies/balanced.yaml
      LLM_PROVIDER: mock
      AUDIT_DB_PATH: /app/data/gateway.db
    volumes:
      - gateway-data:/app/data
    restart: unless-stopped

  gateway-dashboard:
    build: .
    container_name: ai-security-gateway-dashboard
    command: ["streamlit", "run", "dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      AUDIT_DB_PATH: /app/data/gateway.db
    volumes:
      - gateway-data:/app/data
    depends_on:
      - gateway-api
    restart: unless-stopped

volumes:
  gateway-data:
